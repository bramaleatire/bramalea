name: Build product cards
on:
  push:
    branches: [meta-ad-cards]
    paths: ['products.txt', '.github/workflows/cards.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python3 - <<'PY'
          import urllib.request, io
          from PIL import Image
          for line in open('products.txt'):
              line=line.strip()
              if not line: continue
              name,url=line.split(' ',1)
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})).read()
              im=Image.open(io.BytesIO(data)).convert('RGB')
              S=1080; s=min(S*0.78/im.width,S*0.78/im.height)
              im=im.resize((round(im.width*s),round(im.height*s)),Image.LANCZOS)
              c=Image.new('RGB',(S,S),(255,255,255)); c.paste(im,((S-im.width)//2,(S-im.height)//2)); c.save(name+'.jpg',quality=92)
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add *.jpg; git commit -m "Build product cards" || true; git push
